# Configuration file for HydroGraphNet training.
# This file is used by Hydra to configure the training run.

hydra:
  job:
    chdir: True  # Change directory to the job's working directory.
  run:
    dir: /home/woody/iwi5/iwi5416h/hydrographnet/outputs/

# Data configuration: paths for training and testing datasets.
data_dir: /home/woody/iwi5/iwi5416h/hydrographnet/data
test_dir: /home/woody/iwi5/iwi5416h/hydrographnet/data

# Training configuration.
batch_size: 1
epochs: 30
num_training_samples: 425
num_training_time_steps: 300
lr: 0.0001
lr_decay_rate: 0.9999979
weight_decay: 0.0001
num_input_features: 16    # Number of node input features.
num_output_features: 2    # Number of output features (e.g., depth and volume differences).
num_edge_features: 3      # Number of edge features.

# Model architecture (paper Table 2).
processor_size: 5              # Number of GN message-passing blocks.
hidden_dim_processor: 64       # Hidden dimension in processor GN blocks.
hidden_dim_node_encoder: 64    # Output dimension of KAN node encoder.
hidden_dim_edge_encoder: 64    # Hidden dimension of edge encoder MLP.
hidden_dim_node_decoder: 64    # Hidden dimension of node decoder MLP.
num_layers_node_processor: 1   # MLP hidden layers per node update in processor.
num_layers_edge_processor: 1   # MLP hidden layers per edge update in processor.
num_layers_edge_encoder: 1     # MLP hidden layers in edge encoder.
num_layers_node_decoder: 1     # MLP hidden layers in node decoder.
num_harmonics: 5               # Fourier harmonics in KAN encoder.

# Noise settings.
noise_type: "pushforward"  # Changed from "none" to match paper methodology
n_time_steps: 2            # Number of time steps in the sliding window.

# Physics loss settings.
use_physics_loss: true
delta_t: 1200.0
physics_loss_weight: 1.0

# Local conservation loss settings (DualFloodGNN-inspired).
use_local_physics_loss: true
local_physics_loss_weight: 0.1
use_edge_smoothness: true
local_loss_warmup_epochs: 0    # 0 = no warmup; >0 = linear ramp from 0 to target weight over N epochs
use_boundary_masking: false    # Exclude convex hull nodes from local conservation loss
use_huber_residual: false      # Use smooth_l1 instead of L1 for conservation residual
huber_beta: 0.5               # Beta (transition point) for smooth_l1_loss; only used if use_huber_residual=true
graph_type: knn                # "knn" (default) or "delaunay"

# Node loss type.
node_loss_type: "mse"          # "mse" or "huber"
huber_delta: 1.0               # Delta for HuberLoss (only used if node_loss_type=huber)

# Performance and optimization configurations.
use_apex: True            # Use NVIDIA Apex for mixed precision if available.
amp: False                # Automatic mixed precision flag.
jit: False                # Use TorchScript JIT compilation.
num_dataloader_workers: 4
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# WandB logging configuration.
wandb_mode: disabled
watch_model: False

# Checkpoint path.
ckpt_path: /home/woody/iwi5/iwi5416h/hydrographnet/outputs/checkpoints

# Test and visualization configuration.
num_test_samples: 25
num_test_time_steps: 45